name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile bot.py
      - name: Import check (بدون تشغيل)
        run: |
          python -c "
          import ast, sys
          tree = ast.parse(open('bot.py').read())
          print('AST OK:', len(tree.body), 'top-level nodes')
          "
